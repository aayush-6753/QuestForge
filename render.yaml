services:
  - type: web
    runtime: node
    name: life-rpg-backend
    region: singapore
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run db:generate && npm --workspace backend run build
    startCommand: npm --workspace backend run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CLIENT_ORIGINS
        sync: false

  - type: web
    runtime: static
    name: life-rpg-frontend
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm --workspace frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
